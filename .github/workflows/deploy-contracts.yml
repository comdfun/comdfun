name: deploy-contracts

# Deploy the Company.md contracts from GitHub Actions (Actions → deploy-contracts → Run). Pons mode: $COMD itself is
# launched on Pons; pass its address as the comd_token input (required on mainnet; on testnet an empty value deploys
# a MockComd stand-in).
#
#   1. Deploy.s.sol   every contract (Counsel NFT, ERC-8004 registries, RewardDistributor, RevenueRouter, Flywheel,
#                     swapper, Incorporations, launch stack)
#   2. artifacts      deployments/<chainId>.json, broadcast receipts; the api/web env block is printed to the job
#                     summary (scripts/deployment-env.mjs)
#
# Repository secrets: DEPLOYER_PRIVATE_KEY, RPC_URL_MAINNET, RPC_URL_TESTNET.
# Repository (or environment) variables: ADMIN, TREASURY, KEEPER, SETTLER, REGISTRAR, ATTESTER (addresses),
# optional MAX_SWEEP_PRICE, SEAPORT, COUNSEL_BASE_URI.
# The job runs in the GitHub environment named after the network ("testnet" / "mainnet"): add required reviewers
# to "mainnet" under Settings → Environments to get a manual approval gate.
#
# After it: ADMIN calls acceptOwnership() on Flywheel, commit the deployments JSON (+ `npm run contracts:abi`), set the
# printed variables on Railway, open the mint; after the Pons graduation the owner calls setPoolKey on the swapper (DEPLOY.md).

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Robinhood Chain network"
        type: choice
        options: [testnet, mainnet]
        default: testnet
      stage:
        description: "mint = Counsel NFT + ERC-8004 registries only (open the free mint before the Pons launch); full = everything (reuses the mint-stage addresses when the COUNSEL_NFT / IDENTITY_REGISTRY / REPUTATION_REGISTRY variables are set)"
        type: choice
        options: [full, mint]
        default: full
      comd_token:
        description: "$COMD token address from Pons (full stage: required on mainnet; empty on testnet deploys MockComd)"
        type: string
        default: ""
      dry_run:
        description: "Simulate Deploy.s.sol against the chain without broadcasting"
        type: boolean
        default: false
      confirm:
        description: 'Mainnet only: type "deploy mainnet"'
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-contracts-${{ inputs.network }}
  cancel-in-progress: false

env:
  FOUNDRY_VERSION: v1.7.1
  SOLC_VERSION: 0.8.26
  SOLC_SHA256: d5f23436f443edb85d8e76906d12f0a86ce0490e7663a9e608efeb7a93f149ef

jobs:
  deploy:
    name: deploy (${{ inputs.network }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.network }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Resolve network
        id: net
        env:
          NETWORK: ${{ inputs.network }}
          RPC_MAINNET: ${{ secrets.RPC_URL_MAINNET }}
          RPC_TESTNET: ${{ secrets.RPC_URL_TESTNET }}
          CONFIRM: ${{ inputs.confirm }}
          COMD_TOKEN: ${{ inputs.comd_token }}
          STAGE: ${{ inputs.stage }}
        run: |
          if [ "$NETWORK" = mainnet ]; then
            chain=4663; rpc="${RPC_MAINNET:-https://rpc.mainnet.chain.robinhood.com}"
            if [ "$CONFIRM" != "deploy mainnet" ]; then
              echo "::error::mainnet needs the confirm input set to: deploy mainnet"; exit 1
            fi
          else
            chain=46630; rpc="${RPC_TESTNET:-https://rpc.testnet.chain.robinhood.com}"
          fi
          echo "::add-mask::$rpc"
          got="$(cast chain-id --rpc-url "$rpc")"
          if [ "$got" != "$chain" ]; then echo "::error::RPC is chain $got, expected $chain"; exit 1; fi
          if [ -n "$COMD_TOKEN" ]; then
            [[ "$COMD_TOKEN" =~ ^0x[0-9a-fA-F]{40}$ ]] || { echo "::error::comd_token is not an address"; exit 1; }
            code="$(cast code "$COMD_TOKEN" --rpc-url "$rpc")"
            [ "$code" != "0x" ] || { echo "::error::comd_token has no code on chain $chain"; exit 1; }
            echo "COMD $COMD_TOKEN decimals $(cast call "$COMD_TOKEN" 'decimals()(uint8)' --rpc-url "$rpc") supply $(cast call "$COMD_TOKEN" 'totalSupply()(uint256)' --rpc-url "$rpc")"
          elif [ "$NETWORK" = mainnet ] && [ "$STAGE" = full ]; then
            echo "::error::mainnet full stage needs comd_token (the $COMD address from Pons)"; exit 1
          elif [ "$STAGE" = mint ]; then
            echo "mint stage: Counsel NFT + ERC-8004 registries only, no token needed"
          else
            echo "testnet without comd_token: Deploy.s.sol deploys a MockComd stand-in"
          fi
          {
            echo "chain=$chain"
            echo "rpc=$rpc"
          } >> "$GITHUB_OUTPUT"

      - name: Check keys and role addresses
        env:
          NETWORK: ${{ inputs.network }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          RPC_URL: ${{ steps.net.outputs.rpc }}
          ADMIN: ${{ vars.ADMIN }}
          TREASURY: ${{ vars.TREASURY }}
          KEEPER: ${{ vars.KEEPER }}
          SETTLER: ${{ vars.SETTLER }}
          REGISTRAR: ${{ vars.REGISTRAR }}
          ATTESTER: ${{ vars.ATTESTER }}
        run: |
          [ -n "$DEPLOYER_PRIVATE_KEY" ] || { echo "::error::secret DEPLOYER_PRIVATE_KEY is not set"; exit 1; }
          deployer="$(cast wallet address --private-key "$DEPLOYER_PRIVATE_KEY")"
          echo "deployer $deployer ($(cast balance "$deployer" --rpc-url "$RPC_URL" --ether) ETH)"
          lower() { echo "$1" | tr 'A-F' 'a-f'; }
          for v in ADMIN TREASURY KEEPER SETTLER REGISTRAR ATTESTER; do
            val="${!v}"
            if [ -z "$val" ]; then
              if [ "$NETWORK" = mainnet ]; then echo "::error::variable $v must be set for mainnet"; exit 1; fi
              echo "::warning::variable $v unset (Deploy.s.sol defaults the role to ADMIN / the deployer)"
            elif ! [[ "$val" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
              echo "::error::variable $v is not an address: $val"; exit 1
            else
              echo "$v $val"
            fi
          done
          if [ "$NETWORK" = mainnet ] && [ "$(lower "$ADMIN")" = "$(lower "$deployer")" ]; then
            echo "::error::mainnet: ADMIN must be a separate wallet (multisig or hardware), not the deployer"; exit 1
          fi

      - name: External address checklist (mainnet, full stage)
        if: inputs.network == 'mainnet' && inputs.stage == 'full'
        env:
          RPC_URL: ${{ steps.net.outputs.rpc }}
          SEAPORT: ${{ vars.SEAPORT }}
          COMD_TOKEN: ${{ inputs.comd_token }}
        run: bash scripts/check-mainnet-addresses.sh

      - uses: actions/cache@v4
        with:
          path: contracts/lib
          key: contract-libs-${{ hashFiles('scripts/install-contract-libs.sh') }}
      - run: bash scripts/install-contract-libs.sh

      - name: Pre-fetch solc ${{ env.SOLC_VERSION }} (svm layout)
        run: |
          dir="$HOME/.svm/$SOLC_VERSION"; mkdir -p "$dir"
          curl -fsSL -o "$dir/solc-$SOLC_VERSION" \
            "https://github.com/ethereum/solidity/releases/download/v$SOLC_VERSION/solc-static-linux"
          echo "$SOLC_SHA256  $dir/solc-$SOLC_VERSION" | sha256sum -c -
          chmod +x "$dir/solc-$SOLC_VERSION"

      - name: forge build
        working-directory: contracts
        run: forge build --sizes

      - name: Deploy.s.sol ${{ inputs.dry_run && '(dry run)' || '' }}
        id: deploy
        working-directory: contracts
        env:
          RPC_URL: ${{ steps.net.outputs.rpc }}
          CHAIN: ${{ steps.net.outputs.chain }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          STAGE: ${{ inputs.stage }}
          COMD_TOKEN: ${{ inputs.comd_token }}
          COUNSEL_NFT: ${{ vars.COUNSEL_NFT }}
          IDENTITY_REGISTRY: ${{ vars.IDENTITY_REGISTRY }}
          REPUTATION_REGISTRY: ${{ vars.REPUTATION_REGISTRY }}
          ADMIN: ${{ vars.ADMIN }}
          TREASURY: ${{ vars.TREASURY }}
          KEEPER: ${{ vars.KEEPER }}
          SETTLER: ${{ vars.SETTLER }}
          REGISTRAR: ${{ vars.REGISTRAR }}
          MAX_SWEEP_PRICE: ${{ vars.MAX_SWEEP_PRICE }}
          SEAPORT: ${{ vars.SEAPORT }}
          COUNSEL_BASE_URI: ${{ vars.COUNSEL_BASE_URI }}
        run: |
          # unset optional variables must not reach vm.envOr as empty strings
          for v in COMD_TOKEN COUNSEL_NFT IDENTITY_REGISTRY REPUTATION_REGISTRY ADMIN TREASURY KEEPER SETTLER REGISTRAR MAX_SWEEP_PRICE SEAPORT COUNSEL_BASE_URI; do
            [ -n "${!v}" ] || unset "$v"
          done
          broadcast="--broadcast"; [ "$DRY_RUN" = true ] && broadcast=""
          mkdir -p deployments ../.deploy
          forge script script/Deploy.s.sol:Deploy --rpc-url "$RPC_URL" $broadcast --slow 2>&1 | tee ../.deploy/deploy.log
          test "${PIPESTATUS[0]}" -eq 0
          sed -n '/DEPLOYMENTS_JSON_BEGIN/,/DEPLOYMENTS_JSON_END/p' ../.deploy/deploy.log | sed '1d;$d' | sed 's/^ *//' \
            | jq . > ../.deploy/deployment.json
          test "$(jq -r .chainId ../.deploy/deployment.json)" = "$CHAIN"
          if [ "$DRY_RUN" != true ]; then cp ../.deploy/deployment.json "deployments/$CHAIN.json"; fi
          jq . ../.deploy/deployment.json

      - name: Sanity checks
        if: ${{ !inputs.dry_run }}
        env:
          RPC_URL: ${{ steps.net.outputs.rpc }}
          STAGE: ${{ inputs.stage }}
          ADMIN: ${{ vars.ADMIN }}
        run: |
          d=.deploy/deployment.json
          nft="$(jq -r .counselNFT "$d")"
          [ "$(cast call "$nft" 'MAX_SUPPLY()(uint256)' --rpc-url "$RPC_URL" | awk '{print $1}')" = "2000" ] || { echo "::error::CounselNFT MAX_SUPPLY != 2000"; exit 1; }
          [ -z "$ADMIN" ] || [ "$(cast call "$nft" 'owner()(address)' --rpc-url "$RPC_URL" | tr 'A-F' 'a-f')" = "$(echo "$ADMIN" | tr 'A-F' 'a-f')" ] || { echo "::error::CounselNFT owner is not ADMIN"; exit 1; }
          echo "CounselNFT $nft: 2,000 seats, owner ok, contractURI $(cast call "$nft" 'contractURI()(string)' --rpc-url "$RPC_URL")"
          if [ "$STAGE" = mint ]; then echo "mint stage: done"; exit 0; fi
          guard="$(jq -r .launchGuardHook "$d")"
          # v4 hook permissions are the address's low 14 bits (last 4 hex digits suffice)
          [ $(( 0x${guard: -4} & 0x3fff )) -eq $(( 0x2000 )) ] || { echo "::error::LaunchGuardHook flags wrong: $guard"; exit 1; }
          fw="$(jq -r .flywheel "$d")"
          [ "$(cast call "$fw" 'comd()(address)' --rpc-url "$RPC_URL" | tr 'A-F' 'a-f')" = "$(jq -r .comdToken "$d" | tr 'A-F' 'a-f')" ] \
            || { echo "::error::Flywheel.comd() does not match the deployed comdToken"; exit 1; }
          echo "LaunchGuardHook flags ok; Flywheel bound to COMD $(jq -r .comdToken "$d")"

      - name: Environment for Railway (api + web)
        if: ${{ !inputs.dry_run }}
        env:
          STAGE: ${{ inputs.stage }}
          CHAIN: ${{ steps.net.outputs.chain }}
          ATTESTER: ${{ vars.ATTESTER }}
        run: |
          node scripts/deployment-env.mjs "$CHAIN" --deployments contracts/deployments --broadcast contracts/broadcast \
            | tee .deploy/railway.env
          {
            echo "## Company.md contracts on chain $CHAIN"
            echo
            echo '```json'
            cat .deploy/deployment.json
            echo '```'
            echo
            echo "### Railway variables"
            echo '```sh'
            cat .deploy/railway.env
            echo '```'
            [ -n "$ATTESTER" ] && echo "Attester address to publish: \`$ATTESTER\` (api ATTESTER_PRIVATE_KEY)"
            echo
            if [ "$STAGE" = mint ]; then
              echo "Next: set the variables above on Railway (api + web); ADMIN calls setPhase(2) on the Counsel NFT to open"
              echo "the free mint; add repository variables COUNSEL_NFT, IDENTITY_REGISTRY, REPUTATION_REGISTRY with the"
              echo "addresses above so the later full stage reuses them (DEPLOY.md)."
            else
              echo "Next: ADMIN calls acceptOwnership() on Flywheel; commit contracts/deployments/$CHAIN.json and run"
              echo "\`npm run contracts:abi\`; set the variables above on Railway; after the Pons graduation call"
              echo "setPoolKey(fee, tickSpacing, hooks) on the swapper (DEPLOY.md)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployments-${{ inputs.network }}-${{ github.run_number }}
          path: |
            contracts/deployments/${{ steps.net.outputs.chain }}.json
            .deploy/
            contracts/broadcast/Deploy.s.sol/${{ steps.net.outputs.chain }}/
          if-no-files-found: warn
          retention-days: 90
