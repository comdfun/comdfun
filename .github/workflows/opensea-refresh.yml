name: opensea-refresh
# Make OpenSea re-read every Counsel's metadata (traits + image) through its API, item by item. The on-chain path —
# the "Refresh metadata on marketplaces" button on comd.fun/mint (ERC-4906 BatchMetadataUpdate) — is the first thing
# to try; this is for when OpenSea has not caught up.
#
# Two ways to run it:
#  - Manually (Actions → Run workflow): refreshes the given range in one go. With a full OpenSea key (repo secret
#    OPENSEA_API_KEY, Settings → Developer on opensea.io) that is ~17 minutes for all 2,000.
#  - Hourly (the schedule below): for OpenSea's instant free-tier key, which allows only 30 writes per hour — each run
#    refreshes the next 30 Counsel and remembers where it got to in the repo variable OPENSEA_REFRESH_NEXT
#    (2,000 Counsel ≈ 67 hours). If no OPENSEA_API_KEY secret is set, the run mints a free key itself
#    (POST https://api.opensea.io/api/v2/auth/keys — no signup) and uses it for that run only.
#   Disable the workflow (Actions → opensea-refresh → ··· → Disable) once the variable passes 2000.

on:
  workflow_dispatch:
    inputs:
      from:
        description: "First token id"
        default: "1"
      to:
        description: "Last token id"
        default: "2000"
      rps:
        description: "Requests per second"
        default: "2"
      max:
        description: "Stop after this many refreshes (0 = no cap; a free-tier key allows 30 per hour)"
        default: "0"
  schedule:
    - cron: "11 * * * *"

permissions:
  contents: read
  actions: write # the OPENSEA_REFRESH_NEXT repository variable

concurrency: opensea-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Where to start
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          IN_FROM: ${{ inputs.from }}
          IN_TO: ${{ inputs.to }}
          IN_RPS: ${{ inputs.rps }}
          IN_MAX: ${{ inputs.max }}
        run: |
          if [ "$EVENT" = schedule ]; then
            next="$(gh api "repos/$GITHUB_REPOSITORY/actions/variables/OPENSEA_REFRESH_NEXT" --jq .value 2>/dev/null || echo 1)"
            if [ "$next" -gt 2000 ]; then echo "all 2,000 refreshed (OPENSEA_REFRESH_NEXT=$next); disable this workflow" | tee -a "$GITHUB_STEP_SUMMARY"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            { echo "from=$next"; echo "to=2000"; echo "rps=1"; echo "max=30"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
          else
            { echo "from=${IN_FROM:-1}"; echo "to=${IN_TO:-2000}"; echo "rps=${IN_RPS:-2}"; echo "max=${IN_MAX:-0}"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh on OpenSea
        if: steps.plan.outputs.skip != 'true'
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FROM: ${{ steps.plan.outputs.from }}
          TO: ${{ steps.plan.outputs.to }}
          RPS: ${{ steps.plan.outputs.rps }}
          MAX: ${{ steps.plan.outputs.max }}
        run: |
          if [ -z "$OPENSEA_API_KEY" ]; then
            echo "no OPENSEA_API_KEY secret: minting an instant free-tier key for this run"
            for attempt in 1 2 3; do
              resp="$(curl -sS -X POST -H 'accept: application/json' -w '\n%{http_code}' https://api.opensea.io/api/v2/auth/keys || true)"
              code="$(printf '%s' "$resp" | tail -n1)"; body="$(printf '%s' "$resp" | sed '$d')"
              if [ "$code" = 200 ] || [ "$code" = 201 ]; then
                OPENSEA_API_KEY="$(printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).api_key||""))')"
                [ -n "$OPENSEA_API_KEY" ] && break
              fi
              echo "key mint attempt $attempt: HTTP $code ${body:0:160}"; sleep $((attempt * 20))
            done
            [ -n "$OPENSEA_API_KEY" ] || { echo "::error::could not mint a free key (OpenSea throttles key minting per IP; add a full key as the OPENSEA_API_KEY secret, or simply re-run later)"; exit 1; }
            export OPENSEA_API_KEY
          fi
          store() { # remember the cursor so the next run (hourly or manual) continues where this one stopped
            if gh api "repos/$GITHUB_REPOSITORY/actions/variables/OPENSEA_REFRESH_NEXT" >/dev/null 2>&1; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/actions/variables/OPENSEA_REFRESH_NEXT" -f name=OPENSEA_REFRESH_NEXT -f value="$1" >/dev/null 2>&1 || echo "::warning::could not store the cursor ($1)"
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/variables" -f name=OPENSEA_REFRESH_NEXT -f value="$1" >/dev/null 2>&1 || echo "::warning::could not store the cursor ($1)"
            fi
          }
          # work in chunks of 100 and store the cursor after each, so a timeout or a rate limit never loses progress
          cur="$FROM"; code=0; : > /tmp/refresh.log
          while [ "$cur" -le "$TO" ]; do
            chunk_to=$(( cur + 99 )); [ "$chunk_to" -gt "$TO" ] && chunk_to="$TO"
            set +e
            node scripts/opensea-refresh.mjs --from "$cur" --to "$chunk_to" --rps "$RPS" --max "$MAX" | tee -a /tmp/refresh.log
            code=$?
            set -e
            next="$(grep -E '^NEXT [0-9]+' /tmp/refresh.log | tail -n1 | awk '{print $2}')"
            [ -n "$next" ] && store "$next"
            if [ -z "$next" ] || [ "$next" -le "$cur" ]; then echo "no progress from $cur (rate limited?) — stopping this run"; break; fi
            cur="$next"
            [ "$MAX" != 0 ] && break # a capped run (the hourly free-key mode) does one chunk
          done
          { echo "## OpenSea refresh ($EVENT)"; echo; echo '```'; grep -E 'done:|NEXT' /tmp/refresh.log | tail -n 4; echo '```'; [ -n "${next:-}" ] && echo "Next id to refresh: **$next**$( [ "$next" -gt 2000 ] && echo ' — all done; disable this workflow' )"; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
