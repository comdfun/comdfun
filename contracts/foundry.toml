# Company.md — Foundry config
# Default profile is portable (downloads solc 0.8.26 via svm).
# solc is pinned to 0.8.26 because Uniswap v4-core's PoolManager (deployed only in tests and on testnet
# when no POOL_MANAGER is given) declares `pragma solidity 0.8.26` exactly.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }]
# The vendored CC0 ERC-8004 ReputationRegistry only compiles with via-IR (stack too deep otherwise).
additional_compiler_profiles = [{ name = "via-ir", via_ir = true }]
compilation_restrictions = [
  { paths = "lib/erc-8004-contracts/contracts/ReputationRegistryUpgradeable.sol", via_ir = true },
  { paths = "lib/erc-8004-contracts/contracts/IdentityRegistryUpgradeable.sol", via_ir = true },
]

[profile.default.fuzz]
runs = 256

# Offline builds with a locally installed solc 0.8.26 (no download):
#   FOUNDRY_SOLC=$SOLC_PATH FOUNDRY_OFFLINE=true forge test
# or: FOUNDRY_SOLC=$SOLC_PATH FOUNDRY_PROFILE=local forge test
[profile.local]
offline = true
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }]

[profile.local.fuzz]
runs = 256

[lint]
lint_on_build = false
