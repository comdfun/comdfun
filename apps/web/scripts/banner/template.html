<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Company.md banner</title>

<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #000; }
  body { font-family: "IBM Plex Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .b { position: relative; overflow: hidden; background: #000; }
  /* the wall of Counsel, slightly tilted, as the backdrop */
  .grid { position: absolute; inset: -24%; display: grid; gap: var(--gap); transform: rotate(-4deg) scale(1.1); }
  .grid img { width: 100%; height: 100%; display: block; object-fit: cover; image-rendering: pixelated; filter: saturate(1.05) brightness(1.05); }
  .cell { position: relative; overflow: hidden; background: #07060a; border-radius: 3px; aspect-ratio: 4 / 5; }
  /* veil: dark at the text side, the art stays readable at the edges */
  .veil { position: absolute; inset: 0; }
  .rail { position: absolute; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #ffc83d, #ff4fd8, #2de2e6, #8cff3a, #ff8a1f, #9b5cff); }
  .copy { position: absolute; display: grid; align-content: center; }
  .mark { display: flex; align-items: center; gap: var(--mgap); }
  .mark svg { display: block; }
  h1 { font-weight: 600; letter-spacing: -0.03em; color: #f3ebd3; line-height: 1; }
  h1 .md { color: #ffc83d; }
  .strap { color: #cfc8b6; font-weight: 400; }
  .meta { display: flex; gap: var(--metagap); align-items: center; color: #9a9488; font-weight: 500; white-space: nowrap; }
  .meta > span { white-space: nowrap; }
  .meta b { color: #f3ebd3; font-weight: 600; }
  .chip { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; border: 1px solid rgba(243,235,211,.22); border-radius: 999px; color: #f3ebd3; font-weight: 500; }
  .chip i { display: block; border-radius: 50%; background: #8cff3a; }
  .url { color: #ffc83d; font-weight: 600; letter-spacing: -0.01em; }

  /* The two desks, shown as the screens they are. Set in perspective so the pair reads as one object rather
     than two pasted rectangles, and each one carries its desk's colour on the frame and the label. */
  .screens { position: absolute; display: flex; align-items: center; perspective: 2200px; }
  .screen { position: relative; flex: none; border-radius: 10px; overflow: hidden; background: #000;
            border: 1px solid rgba(243,235,211,.16);
            box-shadow: 0 40px 80px -30px rgba(0,0,0,.95), 0 0 0 1px rgba(0,0,0,.6); }
  .screen::after { content: ""; position: absolute; inset: 0;
            background: linear-gradient(118deg, rgba(255,255,255,.1) 0%, transparent 34%),
                        linear-gradient(0deg, rgba(4,3,8,.5), transparent 46%); }
  .screen .bar { position: absolute; left: 0; right: 0; top: 0; z-index: 2; display: flex; align-items: center;
            gap: 5px; padding: 0 9px; background: #0b0910; border-bottom: 1px solid rgba(243,235,211,.1); }
  .screen .bar i { border-radius: 50%; background: #2a2533; }
  .screen .bar i:first-child { background: #ffc83d; }
  .screen img { display: block; width: 100%; height: auto; }
  /* The label has to sit on whatever happens to be at the bottom of that screen, so the gradient behind it is
     tall and nearly opaque at the base: a product name half-legible over a table row looks like an accident. */
  .screen .tag { position: absolute; z-index: 3; left: 0; bottom: 0; right: 0; display: flex; align-items: baseline;
            gap: 7px; padding: 26px 13px 11px;
            background: linear-gradient(0deg, rgba(4,3,8,.99) 0%, rgba(4,3,8,.95) 42%, rgba(4,3,8,.7) 72%, transparent 100%);
            font-weight: 600; letter-spacing: -0.01em; }
  .screen .tag em { font-style: normal; font-weight: 500; color: #9a9488; }
  .s-swarm { --sc: #2de2e6; }
  .s-icm { --sc: #ffc83d; }
  .screen .tag b { color: var(--sc); font-weight: 600; }
  .screen { border-color: color-mix(in srgb, var(--sc, #f3ebd3) 26%, rgba(243,235,211,.14)); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const LOGO = `<svg width="W" height="WH" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 14" shape-rendering="crispEdges" fill="#ffc83d"><title>Company.md</title><rect x="8" y="0" width="2" height="1"></rect><rect x="6" y="1" width="2" height="1"></rect><rect x="10" y="1" width="2" height="1"></rect><rect x="4" y="2" width="2" height="1"></rect><rect x="12" y="2" width="2" height="1"></rect><rect x="2" y="3" width="2" height="1"></rect><rect x="14" y="3" width="2" height="1"></rect><rect x="0" y="4" width="18" height="1"></rect><rect x="1" y="6" width="2" height="1"></rect><rect x="5" y="6" width="2" height="1"></rect><rect x="9" y="6" width="2" height="1"></rect><rect x="13" y="6" width="2" height="1"></rect><rect x="1" y="7" width="2" height="1"></rect><rect x="5" y="7" width="2" height="1"></rect><rect x="9" y="7" width="2" height="1"></rect><rect x="13" y="7" width="2" height="1"></rect><rect x="1" y="8" width="2" height="1"></rect><rect x="5" y="8" width="2" height="1"></rect><rect x="9" y="8" width="2" height="1"></rect><rect x="13" y="8" width="2" height="1"></rect><rect x="1" y="9" width="2" height="1"></rect><rect x="5" y="9" width="2" height="1"></rect><rect x="9" y="9" width="2" height="1"></rect><rect x="13" y="9" width="2" height="1"></rect><rect x="1" y="10" width="2" height="1"></rect><rect x="5" y="10" width="2" height="1"></rect><rect x="9" y="10" width="2" height="1"></rect><rect x="13" y="10" width="2" height="1"></rect><rect x="0" y="12" width="18" height="1"></rect><rect x="0" y="13" width="18" height="1"></rect></svg>`;

// a deterministic spread of ids across the collection
function ids(n, seed) {
  const out = [];
  let x = seed;
  while (out.length < n) {
    x = (x * 1103515245 + 12345) % 2147483648;
    const id = 1 + (x % 2000);
    if (!out.includes(id)) out.push(id);
  }
  return out;
}

/** The line under the strap. `meta.items` is HTML so a preset can bold what matters in its own sentence; the
 *  chip and the url are always first and last, because that is the shape people recognise. */
function metaRow(meta, justify) {
  const dot = Math.round(meta.size * 0.5);
  const items = meta.items ?? ["<b>2,000</b> Counsel", "Paid in <b>$COMD</b>"];
  return `<div class="meta" style="font-size:${meta.size}px; --metagap:${meta.gap}px; justify-content:${justify}">
      <span class="chip" style="font-size:${meta.size}px; padding:${meta.pad}"><i style="width:${dot}px;height:${dot}px"></i>${meta.chip ?? "Live on Robinhood Chain"}</span>
      ${items.map((i) => `<span>${i}</span>`).join("")}
      <span class="url" style="font-size:${meta.size + 1}px">${meta.url ?? "comd.fun"}</span>
    </div>`;
}

function banner({ w, h, cols, rows, pad, logo, title, strap, meta, railTop, copyW, gap }) {
  const el = document.createElement("div");
  el.className = "b";
  el.style.width = w + "px";
  el.style.height = h + "px";
  el.style.setProperty("--gap", gap + "px");
  const list = ids(cols * rows, 7);
  el.innerHTML = `
    <div class="grid" style="grid-template-columns: repeat(${cols}, 1fr); grid-template-rows: repeat(${rows}, 1fr);">
      ${list.map((id) => `<div class="cell"><img src="__ART__/${id}-card.svg" alt=""></div>`).join("")}
    </div>
    <div class="veil"></div>
    <div class="rail" style="${railTop ? "top:0" : "bottom:0"}"></div>
    <div class="copy"></div>`;
  const veil = el.querySelector(".veil");
  if (arguments[0].center) {
    veil.style.background = "radial-gradient(68% 150% at 50% 42%, rgba(4,3,8,.95) 0%, rgba(4,3,8,.9) 42%, rgba(4,3,8,.5) 72%, rgba(4,3,8,.28) 100%)";
    const c = el.querySelector(".copy");
    c.style.left = "0"; c.style.right = "0"; c.style.width = "100%"; c.style.top = "0"; c.style.bottom = "16%";
    c.style.justifyItems = "center"; c.style.textAlign = "center"; c.style.gap = logo.gap + "px";
    c.innerHTML = `
      <div class="mark" style="--mgap:${logo.gap2}px; justify-content:center">
        ${LOGO.replace(/"W"/, '"' + logo.size + '"').replace(/"WH"/, '"' + Math.round(logo.size * 14 / 18) + '"')}
        <h1 style="font-size:${title.size}px">Company<span class="md">.md</span></h1>
      </div>
      <p class="strap" style="font-size:${strap.size}px; line-height:1.4; max-width:${strap.max}px; margin:0 auto">${strap.text}</p>
      ${metaRow(meta, "center")}`;
    return el;
  }
  // With the screens on, the art is a texture behind everything rather than a half of the picture, so the veil
  // is even instead of a left-to-right wipe: a bright right edge would fight the screens sitting on top of it.
  veil.style.background = arguments[0].screens
    ? `linear-gradient(90deg, rgba(4,3,8,.965) 0%, rgba(4,3,8,.945) 46%, rgba(4,3,8,.935) 100%), radial-gradient(60% 120% at 78% 50%, rgba(255,200,61,.07), transparent 70%), radial-gradient(50% 110% at 20% 40%, rgba(45,226,230,.06), transparent 70%)`
    : `linear-gradient(90deg, rgba(4,3,8,.94) 0%, rgba(4,3,8,.9) ${copyW - 16}%, rgba(4,3,8,.55) ${copyW + 12}%, rgba(4,3,8,.3) 100%), linear-gradient(0deg, rgba(0,0,0,.45), transparent 45%)`;
  const copy = el.querySelector(".copy");
  copy.style.left = pad + "px";
  copy.style.top = "0";
  copy.style.bottom = arguments[0].screens?.place === "bottom" ? `${arguments[0].screens.clear}px` : "0";
  copy.style.width = `calc(${copyW}% - ${pad}px)`;
  copy.style.gap = logo.gap + "px";
  copy.innerHTML = `
    <div class="mark" style="--mgap:${logo.gap2}px">
      ${LOGO.replace(/"W"/, '"' + logo.size + '"').replace(/"WH"/, '"' + Math.round(logo.size * 14 / 18) + '"')}
      <h1 style="font-size:${title.size}px">Company<span class="md">.md</span></h1>
    </div>
    <p class="strap" style="font-size:${strap.size}px; line-height:1.4; max-width:${strap.max}px">${strap.text}</p>
    ${metaRow(meta, "start")}`;
  if (arguments[0].screens) el.appendChild(screens(arguments[0].screens));
  return el;
}

/** The pair of desks, in perspective, with the newer one in front. */
function screens(s) {
  const wrap = document.createElement("div");
  wrap.className = "screens";
  // Beside the copy on a wide card, under it on a squarer one. At 1200x630 there is not enough width for a
  // headline and two screens on the same line, and the headline loses: it gets clipped by the frame in front.
  wrap.style.cssText = s.place === "bottom"
    ? `left:0; right:0; bottom:${s.bottom}px; justify-content:center; gap:${s.gap}px`
    : `right:${s.right}px; top:50%; transform:translateY(-50%); gap:${s.gap}px`;
  const one = ({ cls, src, w, label, note, rot, lift, z, dim }) => `
    <div class="screen ${cls}" style="width:${w}px; z-index:${z}; transform: rotateY(${rot}deg) translateY(${lift}px); ${dim ? "filter:brightness(.82) saturate(.9)" : ""}">
      <div class="bar" style="height:${s.bar}px">
        <i style="width:${s.dot}px;height:${s.dot}px"></i><i style="width:${s.dot}px;height:${s.dot}px"></i><i style="width:${s.dot}px;height:${s.dot}px"></i>
      </div>
      <img src="${src}" alt="">
      <div class="tag" style="font-size:${s.tag}px"><b>${label}</b><em>${note}</em></div>
    </div>`;
  wrap.innerHTML =
    one({ cls: "s-swarm", src: "__SHOT_SWARM__", w: s.w, label: "The Swarm", note: "2,000 Counsel", rot: s.rot, lift: s.lift, z: 1, dim: true }) +
    one({ cls: "s-icm", src: "__SHOT_ICM__", w: s.w, label: "cICM", note: "inference for $COMD", rot: -s.rot, lift: -s.lift, z: 2, dim: false });
  return wrap;
}

const PRESETS = {
  // og and x carry both desks, because those are the cards people meet the project through and the firm is two
  // desks now. opensea stays on the collection: whoever is looking is looking at the NFTs.
  og: { w: 1200, h: 630, cols: 14, rows: 8, gap: 8, pad: 66, copyW: 94, railTop: false,
        logo: { size: 44, gap: 16, gap2: 16 }, title: { size: 60 },
        strap: { size: 20, max: 760, text: "A Swarm of <b style=\"color:#f3ebd3;font-weight:600\">2,000 NFT agents</b> and a Desk That Sells <b style=\"color:#f3ebd3;font-weight:600\">Inference</b> to Humans, Agents and Counsel. Both paid in <b style=\"color:#ffc83d;font-weight:600\">$COMD</b>." },
        meta: { size: 14, gap: 14, pad: "5px 11px", items: ["<b>cICM</b> inference", "Burns <b>$COMD</b>"] },
        screens: { place: "bottom", bottom: 22, clear: 304, gap: 26, w: 406, rot: 8, lift: 9, bar: 17, dot: 5, tag: 14 } },
  // 3:1, the same composition with room to breathe
  wide: { w: 1800, h: 600, cols: 20, rows: 7, gap: 8, pad: 76, copyW: 94, railTop: false,
        logo: { size: 46, gap: 16, gap2: 17 }, title: { size: 64 },
        strap: { size: 21, max: 1060, text: "A Swarm of <b style=\"color:#f3ebd3;font-weight:600\">2,000 NFT agents</b> and a Desk That Sells <b style=\"color:#f3ebd3;font-weight:600\">Inference</b> to Humans, Agents and Counsel. Both paid in <b style=\"color:#ffc83d;font-weight:600\">$COMD</b>." },
        meta: { size: 15, gap: 16, pad: "5px 12px", items: ["<b>cICM</b> inference", "Burns <b>$COMD</b>"] },
        screens: { place: "bottom", bottom: 26, clear: 300, gap: 32, w: 428, rot: 8, lift: 9, bar: 17, dot: 5, tag: 14 } },
  x: { w: 1500, h: 500, cols: 20, rows: 7, gap: 8, pad: 76, copyW: 46, railTop: false,
       logo: { size: 40, gap: 16, gap2: 14 }, title: { size: 54 },
       strap: { size: 18, max: 560, text: "A Swarm of <b style=\"color:#f3ebd3;font-weight:600\">2,000 NFT agents</b> and a Desk That Sells <b style=\"color:#f3ebd3;font-weight:600\">Inference</b> to Humans, Agents and Counsel. Both paid in <b style=\"color:#ffc83d;font-weight:600\">$COMD</b>." },
       meta: { size: 14, gap: 14, pad: "4px 10px", items: ["<b>cICM</b> inference", "Burns <b>$COMD</b>"] },
       screens: { right: 46, gap: 18, w: 372, rot: 11, lift: 13, bar: 16, dot: 5, tag: 13 } },
  opensea: { w: 1400, h: 350, cols: 20, rows: 5, gap: 7, pad: 60, copyW: 54, railTop: false,
       logo: { size: 40, gap: 16, gap2: 14 }, title: { size: 56 },
       strap: { size: 18, max: 580, text: "2,000 Counsel. Each NFT is an ERC-8004 agent its holder runs, earning $COMD for accepted work." },
       meta: { size: 14, gap: 16, pad: "4px 10px" } },
};

const which = window.__preset || new URLSearchParams(location.search).get("v") || "og";
const root = document.getElementById("root");
root.appendChild(banner(PRESETS[which]));
document.title = "banner-" + which;
</script>
</body>
</html>
